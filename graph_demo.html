<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HardCoded – Attack-Path Graph</title>
<style>
:root{--bg:#fff;--fg:#1c1f26;--mut:#6b7280;--card:#f4f5f7;--line:#d5d8de;
--c-critical:#e5484d;--c-high:#f59f00;--c-medium:#3b82f6;--c-low:#94a3b8;--c-unknown:#a78bfa;
--s-confirmed:#2f9e5b;--s-inferred:#2f9e5b;--s-stale:#f59f00;--s-unknown:#8b5cf6;--s-expired:#e5484d;--s-conditional:#0ea5e9;--s-invalidated:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8eaee;--mut:#9aa1ad;--card:#1e2127;--line:#363b45}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}
aside{width:340px;padding:16px;overflow:auto;border-right:1px solid var(--line);flex:none}
main{flex:1;overflow:auto;position:relative}
h1{font-size:17px;margin:0 0 2px}h2{font-size:13px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
p.sub{margin:0;color:var(--mut);font-size:12px}
.path{padding:7px 9px;margin:4px 0;border-radius:8px;background:var(--card);cursor:pointer;border:1.5px solid transparent;font-size:12.5px}
.path:hover{border-color:var(--line)}.path.on{border-color:var(--fg)}
.badge{float:right;font-size:11px;padding:1px 7px;border-radius:99px;color:#fff}
.b-feasible_under_model{background:var(--s-confirmed)}.b-conditional{background:var(--s-stale)}.b-blocked{background:var(--s-expired)}
.leg{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}
.sw{width:26px;height:0;border-top:3px solid}.dot{width:12px;height:12px;border-radius:50%}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:300px;display:none;z-index:9;white-space:pre-line}
button{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.dim{opacity:.12}
text{font-family:system-ui,Segoe UI,sans-serif}
</style></head><body>
<aside>
<h1>Attack-path graph</h1>
<p class="sub">Synthetic AWS org · edges are <i>possible</i> paths under the model, not proof.</p>
<h2>Paths (click to highlight)</h2>
<button id="clear">Show all</button>
<div id="paths"></div>
<h2>Edge status</h2><div id="legE"></div>
<h2>Node criticality</h2><div id="legN"></div>
</aside>
<main><svg id="svg"></svg></main>
<div id="tip"></div>
<script>
const D={"nodes": [{"key": "alice", "id": "arn:aws:iam::111111111111:user/alice", "name": "alice", "type": "iam_user", "crit": "low", "account": "111111111111", "col": 0, "row": 0}, {"key": "web-server", "id": "arn:aws:ec2:us-east-1:111111111111:instance/i-0web", "name": "web-server", "type": "ec2_instance", "crit": "medium", "account": "111111111111", "col": 0, "row": 1}, {"key": "vendor", "id": "arn:aws:iam::222222222222:root", "name": "partner-vendor", "type": "external_principal", "crit": "low", "account": "222222222222", "col": 0, "row": 2}, {"key": "dev-role", "id": "arn:aws:iam::111111111111:role/dev-role", "name": "dev-role", "type": "iam_role", "crit": "medium", "account": "111111111111", "col": 1, "row": 0.5}, {"key": "ops-role", "id": "arn:aws:iam::111111111111:role/ops-role", "name": "ops-role", "type": "iam_role", "crit": "high", "account": "111111111111", "col": 2, "row": 0}, {"key": "deploy-role", "id": "arn:aws:iam::111111111111:role/deploy-role", "name": "deploy-role", "type": "iam_role", "crit": "high", "account": "111111111111", "col": 2, "row": 1.3}, {"key": "etl-role", "id": "arn:aws:iam::111111111111:role/etl-role", "name": "etl-role", "type": "iam_role", "crit": "high", "account": "111111111111", "col": 3, "row": 0.4}, {"key": "break-glass", "id": "arn:aws:iam::111111111111:role/break-glass-role", "name": "break-glass-role", "type": "iam_role", "crit": "critical", "account": "111111111111", "col": 2, "row": 2.6}, {"key": "customer-data", "id": "arn:aws:s3:::customer-data", "name": "customer-data", "type": "s3_bucket", "crit": "critical", "account": "111111111111", "col": 4, "row": 0}, {"key": "dev-scratch", "id": "arn:aws:s3:::dev-scratch", "name": "dev-scratch", "type": "s3_bucket", "crit": "low", "account": "111111111111", "col": 4, "row": 2.6}, {"key": "db-creds", "id": "arn:aws:secretsmanager:us-east-1:111111111111:secret:db-creds", "name": "db-creds", "type": "secret", "crit": "critical", "account": "111111111111", "col": 4, "row": 1.2}], "edges": [{"key": "E1", "src": "alice", "dst": "dev-role", "rel": "can_assume", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E2", "src": "web-server", "dst": "dev-role", "rel": "runs_as", "status": "stale", "visual": "stale", "conditions": {}, "valid_until": null}, {"key": "E3", "src": "dev-role", "dst": "ops-role", "rel": "can_assume", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E4", "src": "ops-role", "dst": "etl-role", "rel": "can_pass_role", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E5", "src": "etl-role", "dst": "customer-data", "rel": "can_read", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E6", "src": "etl-role", "dst": "db-creds", "rel": "can_read", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E7", "src": "dev-role", "dst": "deploy-role", "rel": "can_assume", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E8", "src": "deploy-role", "dst": "etl-role", "rel": "can_pass_role", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E9", "src": "vendor", "dst": "deploy-role", "rel": "can_assume", "status": "confirmed", "visual": "conditional", "conditions": {"sts:ExternalId": "required"}, "valid_until": null}, {"key": "E10", "src": "deploy-role", "dst": "db-creds", "rel": "can_read", "status": "unknown", "visual": "unknown", "conditions": {}, "valid_until": null}, {"key": "E11", "src": "dev-role", "dst": "break-glass", "rel": "can_assume", "status": "confirmed", "visual": "expired", "conditions": {}, "valid_until": "2026-09-01T00:00:00+00:00"}, {"key": "E12", "src": "break-glass", "dst": "customer-data", "rel": "can_read", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}, {"key": "E13", "src": "dev-role", "dst": "dev-scratch", "rel": "can_read", "status": "confirmed", "visual": "confirmed", "conditions": {}, "valid_until": null}], "paths": [{"edges": ["E1", "E3", "E4", "E5"], "feasibility": "feasible_under_model"}, {"edges": ["E1", "E3", "E4", "E6"], "feasibility": "feasible_under_model"}, {"edges": ["E1", "E7", "E8", "E5"], "feasibility": "feasible_under_model"}, {"edges": ["E1", "E7", "E8", "E6"], "feasibility": "feasible_under_model"}, {"edges": ["E1", "E7", "E10"], "feasibility": "conditional"}, {"edges": ["E1", "E11", "E12"], "feasibility": "blocked"}, {"edges": ["E2", "E3", "E4", "E5"], "feasibility": "conditional"}, {"edges": ["E2", "E3", "E4", "E6"], "feasibility": "conditional"}, {"edges": ["E2", "E7", "E8", "E5"], "feasibility": "conditional"}, {"edges": ["E2", "E7", "E8", "E6"], "feasibility": "conditional"}, {"edges": ["E2", "E7", "E10"], "feasibility": "conditional"}, {"edges": ["E2", "E11", "E12"], "feasibility": "blocked"}, {"edges": ["E9", "E8", "E5"], "feasibility": "conditional"}, {"edges": ["E9", "E8", "E6"], "feasibility": "conditional"}, {"edges": ["E9", "E10"], "feasibility": "conditional"}], "now": "2026-10-01T12:00:00+00:00"};
const W=170,H=46,GX=250,GY=110,PX=40,PY=50,NS="http://www.w3.org/2000/svg";
const byKey=Object.fromEntries(D.nodes.map(n=>[n.key,n]));
const pos=n=>({x:PX+n.col*GX,y:PY+n.row*GY});
const css=v=>`var(--${v})`;
const svg=document.getElementById("svg");
const maxX=PX+4*GX+W+40,maxY=PY+3*GY+H+60;
svg.setAttribute("viewBox",`0 0 ${maxX} ${maxY}`);svg.style.width="100%";svg.style.height="100%";
const el=(t,a={},p=svg,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};

const defs=el("defs");
["confirmed","stale","unknown","expired","conditional","inferred","invalidated"].forEach(s=>{
 const m=el("marker",{id:"a-"+s,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"},defs);
 el("path",{d:"M0 0L10 5L0 10z",fill:css("s-"+s)},m)});

const edgeEls={},nodeEls={};
const dashed=s=>["stale","unknown","expired","conditional"].includes(s)?"7 5":"none";
D.edges.forEach(e=>{
 const a=pos(byKey[e.src]),b=pos(byKey[e.dst]);
 const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,dx=Math.max(60,(x2-x1)/2);
 const g=el("g");
 const path=el("path",{d:`M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`,fill:"none",
  stroke:css("s-"+e.visual),"stroke-width":2.4,"stroke-dasharray":dashed(e.visual),"marker-end":`url(#a-${e.visual})`},g);
 const mx=(x1+x2)/2,my=(y1+y2)/2+(y1===y2?-6:0);
 el("rect",{x:mx-17,y:my-9,width:34,height:17,rx:8,fill:"var(--bg)",stroke:css("s-"+e.visual),"stroke-width":1},g);
 el("text",{x:mx,y:my+3.5,"text-anchor":"middle","font-size":10.5,fill:"var(--fg)"},g,e.key);
 g.style.cursor="help";
 const info=`${e.key}: ${byKey[e.src].name} —${e.rel}→ ${byKey[e.dst].name}\nStatus: ${e.visual}`+
  (e.conditions&&Object.keys(e.conditions).length?`\nConditions: ${JSON.stringify(e.conditions)}`:"")+
  (e.valid_until?`\nValid until: ${e.valid_until.slice(0,10)}`:"");
 tip(g,info);edgeEls[e.key]=g});

D.nodes.forEach(n=>{
 const p=pos(n),g=el("g");
 el("rect",{x:p.x,y:p.y,width:W,height:H,rx:10,fill:"var(--card)",stroke:css("c-"+n.crit),"stroke-width":3},g);
 el("text",{x:p.x+W/2,y:p.y+20,"text-anchor":"middle","font-size":13,"font-weight":600,fill:"var(--fg)"},g,n.name);
 el("text",{x:p.x+W/2,y:p.y+36,"text-anchor":"middle","font-size":10.5,fill:"var(--mut)"},g,n.type.replace(/_/g," ")+" · "+n.crit);
 tip(g,`${n.name}\n${n.id}\nCriticality: ${n.crit}\nAccount: ${n.account||"?"}`);
 nodeEls[n.key]=g});

function tip(node,text){const t=document.getElementById("tip");
 node.addEventListener("mousemove",ev=>{t.textContent=text;t.style.display="block";t.style.left=ev.clientX+14+"px";t.style.top=ev.clientY+14+"px"});
 node.addEventListener("mouseleave",()=>t.style.display="none")}

function highlight(i){
 document.querySelectorAll(".path").forEach((p,j)=>p.classList.toggle("on",j===i));
 const all=i<0;const es=new Set(all?[]:D.paths[i].edges),ns=new Set();
 es.forEach(k=>{const e=D.edges.find(x=>x.key===k);ns.add(e.src);ns.add(e.dst)});
 for(const k in edgeEls)edgeEls[k].classList.toggle("dim",!all&&!es.has(k));
 for(const k in nodeEls)nodeEls[k].classList.toggle("dim",!all&&!ns.has(k))}

const pl=document.getElementById("paths");
D.paths.forEach((p,i)=>{
 const first=D.edges.find(x=>x.key===p.edges[0]),last=D.edges.find(x=>x.key===p.edges[p.edges.length-1]);
 const d=document.createElement("div");d.className="path";
 d.innerHTML=`<span class="badge b-${p.feasibility}">${p.feasibility.replace(/_under_model/,"")}</span><b>${byKey[first.src].name}</b> → <b>${byKey[last.dst].name}</b><br><span style="color:var(--mut)">${p.edges.join(" → ")}</span>`;
 d.onclick=()=>highlight(i);pl.appendChild(d)});
document.getElementById("clear").onclick=()=>highlight(-1);

const leg=(id,items,fn)=>{const c=document.getElementById(id);items.forEach(([l,v])=>{const r=document.createElement("div");r.className="leg";r.innerHTML=fn(v)+l;c.appendChild(r)})};
leg("legE",[["confirmed","confirmed"],["stale (freshness window passed)","stale"],["unknown (collection failed)","unknown"],["expired (outside validity window)","expired"],["has unresolved conditions","conditional"]],
 v=>`<span class="sw" style="border-color:${css("s-"+v)};border-top-style:${dashed(v)==="none"?"solid":"dashed"}"></span>`);
leg("legN",[["critical","critical"],["high","high"],["medium","medium"],["low","low"]],v=>`<span class="dot" style="background:${css("c-"+v)}"></span>`);
</script></body></html>
